name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *" # Se actualiza automáticamente cada medianoche
  workflow_dispatch: # Nos permite ejecutarlo manualmente con un botón

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3
        with:
          # Busca las contribuciones de tu usuario
          github_user_name: ${{ github.repository_owner }}
          # Genera la imagen normal y la versión oscura con víbora morada
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#4A0E4E
            
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          # Guarda las imágenes en una rama oculta llamada "output"
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
